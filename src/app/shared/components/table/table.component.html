<button (click)="addRow()">Zeile hinzufügen</button>
<table>
    <thead>
        <tr>
            <th *ngFor="let model of tableColumnData">
                {{model.title}}
            </th>
        </tr>
    </thead>
    <tbody>
        <tr table-row *ngFor="let formGroup of formArray.controls, index as i" [tableColumnData]="tableColumnData"
            [form]="formGroup" (remove)="removeRow(i)"></tr>
    </tbody>
</table>
